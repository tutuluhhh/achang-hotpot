<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>马厂老火锅 - 多人在线点菜</title>

<!-- Socket.IO Client -->
<script src="/socket.io/socket.io.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    color: #333;
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #FFD54F 0%, #FFB300 100%);
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .header h1 {
    font-size: 20px;
    font-weight: 700;
    color: #333;
  }
  .header .subtitle {
    font-size: 13px;
    color: #666;
    margin-top: 2px;
  }
  .header .user-badge {
    display: inline-block;
    background: rgba(255,255,255,0.85);
    padding: 3px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    margin-top: 8px;
    color: #E65100;
  }
  .header .back-btn {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: #333;
    display: none;
  }
  .header .room-info {
    display: inline-block;
    background: rgba(255,255,255,0.6);
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 11px;
    color: #666;
    margin-left: 8px;
  }
  .header .online-info {
    display: inline-flex;
    align-items: center;
    background: rgba(76,175,80,0.15);
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 11px;
    color: #2E7D32;
    margin-left: 6px;
  }
  .header .online-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #4CAF50;
    border-radius: 50%;
    margin-right: 4px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* Screens */
  .screen { display: none; }
  .screen.active { display: block; }

  /* User Selection */
  .user-select {
    padding: 40px 20px;
    text-align: center;
  }
  .user-select h2 {
    font-size: 24px;
    margin-bottom: 8px;
    color: #333;
  }
  .user-select p {
    color: #888;
    font-size: 14px;
    margin-bottom: 32px;
  }
  .user-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    max-width: 400px;
    margin: 0 auto;
  }
  .summary-entry-btn {
    display: block;
    margin: 28px auto 0;
    padding: 12px 32px;
    background: linear-gradient(135deg, #FFD54F 0%, #FFB300 100%);
    color: #333;
    border: none;
    border-radius: 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(255,179,0,0.3);
    transition: all 0.2s;
  }
  .summary-entry-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(255,179,0,0.4);
  }
  .summary-entry-btn:active {
    transform: scale(0.97);
  }
  .user-card {
    background: white;
    border-radius: 16px;
    padding: 24px 16px;
    cursor: pointer;
    transition: all 0.2s;
    border: 2px solid transparent;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    position: relative;
  }
  .user-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  }
  .user-card:active {
    transform: scale(0.96);
  }
  .user-card .online-indicator {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 10px;
    height: 10px;
    background: #4CAF50;
    border-radius: 50%;
    border: 2px solid white;
  }
  .avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    margin: 0 auto 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 700;
    color: white;
  }
  .name {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .status {
    font-size: 12px;
    color: #999;
  }
  .status.ordered {
    color: #4CAF50;
    font-weight: 500;
  }

  /* Menu Layout */
  .menu-layout {
    display: flex;
    height: calc(100vh - 120px);
  }
  .category-nav {
    width: 90px;
    background: white;
    overflow-y: auto;
    border-right: 1px solid #eee;
    flex-shrink: 0;
  }
  .cat-item {
    padding: 14px 8px;
    font-size: 13px;
    text-align: center;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.2s;
  }
  .cat-item.active {
    background: #FFF8E1;
    border-left-color: #FFB300;
    color: #E65100;
    font-weight: 600;
  }
  .menu-content {
    flex: 1;
    overflow-y: auto;
    padding: 0 12px 100px;
  }
  .cat-section-title {
    font-size: 16px;
    font-weight: 700;
    padding: 16px 4px 8px;
    color: #333;
  }
  .dish-card {
    display: flex;
    background: white;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .dish-img {
    width: 64px;
    height: 64px;
    background: #FFF8E1;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    flex-shrink: 0;
    margin-right: 12px;
  }
  .dish-info {
    flex: 1;
    min-width: 0;
  }
  .dish-name {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .dish-name .star {
    color: #FFB300;
    margin-right: 4px;
  }
  .dish-recommend {
    font-size: 11px;
    color: #FF6B35;
    margin-bottom: 4px;
  }
  .dish-desc {
    font-size: 12px;
    color: #999;
    margin-bottom: 6px;
    line-height: 1.4;
  }
  .dish-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .dish-price {
    font-size: 16px;
    font-weight: 700;
    color: #E65100;
  }
  .dish-price span {
    font-size: 12px;
    font-weight: 400;
    color: #999;
  }
  .dish-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .qty-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .qty-btn.plus {
    background: #FFB300;
    color: white;
  }
  .qty-btn.minus {
    background: #fff;
    color: #E65100;
    border: 1.5px solid #E65100;
  }
  .qty-btn:active {
    transform: scale(0.9);
  }
  .qty-num {
    font-size: 15px;
    font-weight: 600;
    min-width: 20px;
    text-align: center;
  }

  /* Cart Bar */
  .cart-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    padding: 12px 16px;
    box-shadow: 0 -2px 12px rgba(0,0,0,0.1);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 99;
  }
  .cart-info {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    user-select: none;
  }
  .cart-info:active {
    opacity: 0.7;
  }
  .cart-icon {
    font-size: 28px;
    position: relative;
  }
  .cart-badge {
    position: absolute;
    top: -6px;
    right: -8px;
    background: #E65100;
    color: white;
    font-size: 11px;
    font-weight: 700;
    min-width: 18px;
    height: 18px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
  }
  .cart-total {
    font-size: 20px;
    font-weight: 700;
    color: #E65100;
  }
  .cart-total span:first-child {
    font-size: 14px;
  }
  .cart-btn, .summary-btn {
    padding: 10px 20px;
    border-radius: 22px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .cart-btn {
    background: linear-gradient(135deg, #FFD54F 0%, #FFB300 100%);
    color: #333;
  }
  .cart-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .summary-btn {
    background: #fff;
    color: #E65100;
    border: 1.5px solid #E65100;
  }
  .switch-user-btn {
    position: fixed;
    bottom: 70px;
    right: 16px;
    background: white;
    border: 1.5px solid #ddd;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    z-index: 98;
  }

  /* Summary */
  .summary-screen {
    padding: 16px;
    padding-bottom: 40px;
  }
  .summary-tabs {
    display: flex;
    background: white;
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .summary-tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .summary-tab.active {
    background: #FFB300;
    color: white;
  }
  .summary-section {
    background: white;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .summary-section h3 {
    font-size: 15px;
    margin-bottom: 12px;
    color: #333;
  }
  .person-header {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid #f0f0f0;
  }
  .avatar-sm {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: white;
  }
  .person-dish {
    display: flex;
    align-items: center;
    padding: 8px 0;
    font-size: 14px;
  }
  .pd-name {
    flex: 1;
  }
  .pd-qty {
    color: #E65100;
    font-weight: 600;
    margin: 0 12px;
  }
  .summary-row {
    display: flex;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #f5f5f5;
  }
  .summary-row:last-child {
    border-bottom: none;
  }
  .dish-name-sm {
    flex: 1;
    font-size: 14px;
  }
  .dish-qty {
    font-size: 14px;
    font-weight: 600;
    color: #E65100;
    margin: 0 12px;
  }
  .dish-price-sm {
    font-size: 14px;
    font-weight: 600;
    color: #333;
    min-width: 50px;
    text-align: right;
  }
  .adjust-btns {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0 12px;
  }
  .adj-btn {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid #FFB300;
    background: white;
    color: #E65100;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .adj-num {
    font-size: 14px;
    font-weight: 600;
    min-width: 20px;
    text-align: center;
  }
  .total-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0 0;
    margin-top: 8px;
    border-top: 2px solid #FFB300;
    font-size: 15px;
    font-weight: 600;
  }
  .total-price {
    font-size: 18px;
    color: #E65100;
  }
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #999;
  }
  .empty-state .icon {
    font-size: 48px;
    margin-bottom: 16px;
  }

  /* Toast */
  .toast {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8);
    color: white;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 1000;
  }

  /* Loading */
  .loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(255,255,255,0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }
  .loading-spinner {
    width: 40px;
    height: 40px;
    border: 3px solid #f3f3f3;
    border-top: 3px solid #FFB300;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .loading-text {
    margin-top: 16px;
    font-size: 14px;
    color: #666;
  }

  /* Responsive */
  @media (max-width: 480px) {
    .category-nav { width: 76px; }
    .cat-item { font-size: 12px; padding: 12px 4px; }
    .dish-img { width: 56px; height: 56px; font-size: 28px; }
    .dish-name { font-size: 14px; }
    .dish-price { font-size: 15px; }
  }
</style>
</head>
<body>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">正在连接...</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- ========== Screen 1: User Selection ========== -->
<div class="screen active" id="screen-user">
  <div class="header">
    <h1>马厂老火锅</h1>
    <div class="subtitle">真如店 · 多人在线点菜 <span class="room-info" id="roomInfo"></span><span class="online-info" id="onlineInfo" style="display:none"><span class="online-dot"></span><span id="onlineCount">0</span>人在线</span></div>
  </div>
  <div class="user-select">
    <h2>选择你的身份</h2>
    <p>选好后开始点菜，所有人的选择会实时同步</p>
    <div class="user-grid" id="userGrid"></div>
    <button class="summary-entry-btn" onclick="showScreen('summary')"> 查看汇总</button>
    <button class="summary-entry-btn" onclick="startNewSession()" style="background:linear-gradient(135deg,#ef5350,#e53935);margin-top:12px;color:white">🔄 开始新点菜</button>
  </div>
</div>

<!-- ========== Screen 2: Menu ========== -->
<div class="screen" id="screen-menu">
  <div class="header">
    <button class="back-btn" id="backBtn" onclick="showScreen('user')">&#8249;</button>
    <h1>马厂老火锅</h1>
    <div class="subtitle" id="menuSubtitle">点菜中...</div>
    <div class="user-badge" id="currentUserBadge"></div>
  </div>
  <div class="menu-layout">
    <div class="category-nav" id="categoryNav"></div>
    <div class="menu-content" id="menuContent"></div>
  </div>
  <div class="cart-bar" id="cartBar">
    <div class="cart-info" onclick="showCartPopup()">
      <div class="cart-icon">
        🛒
        <div class="cart-badge" id="cartBadge" style="display:none">0</div>
      </div>
      <div class="cart-total"><span>¥</span><span id="cartTotal">0</span></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="summary-btn" onclick="showScreen('summary')">查看汇总</button>
      <button class="cart-btn" id="submitBtn" onclick="submitOrder()">提交订单</button>
    </div>
  </div>
  <button class="switch-user-btn" onclick="showScreen('user')">切换用户</button>
</div>

<!-- Cart Popup Overlay -->
<div id="cartPopup" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:200;justify-content:center;align-items:flex-end" onclick="closeCartPopup(event)">
  <div style="background:white;border-radius:20px 20px 0 0;padding:20px;max-height:70vh;overflow-y:auto;width:100%;max-width:500px" onclick="event.stopPropagation()">
    <div style="text-align:center;margin-bottom:16px">
      <div style="width:40px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 12px"></div>
      <h3 style="font-size:17px;color:#333" id="cartPopupTitle">我的订单</h3>
    </div>
    <div id="cartPopupContent"></div>
  </div>
</div>

<!-- ========== Screen 3: Summary ========== -->
<div class="screen" id="screen-summary">
  <div class="header">
    <button class="back-btn" style="display:block" onclick="goBackFromSummary()">&#8249;</button>
    <h1>点菜汇总</h1>
    <div class="subtitle" id="summarySubtitle">所有人点菜情况</div>
  </div>
  <div class="summary-screen" id="summaryContent"></div>
</div>

<script>
// ==================== SOCKET.IO CONNECTION ====================
const socket = io({
  reconnection: true,
  reconnectionAttempts: 10,
  reconnectionDelay: 1000
});

// Reconnect to room after reconnection
socket.on('connect', () => {
  socket.emit('join-room', ROOM_ID);
});

socket.on('reconnect', () => {
  showToast('已重新连接');
});

socket.on('reconnect_error', () => {
  document.getElementById('loadingOverlay').style.display = 'flex';
  document.querySelector('.loading-text').textContent = '连接断开，正在重连...';
});

socket.on('reconnect_failed', () => {
  document.querySelector('.loading-text').textContent = '连接失败，请刷新页面';
});

// ==================== ROOM MANAGEMENT ====================
// Fixed default room so everyone joins the same room
const DEFAULT_ROOM = 'machang-hotpot-zhenru';

function getRoomId() {
  // 1. URL hash takes priority (for sharing specific rooms)
  let roomId = window.location.hash.slice(1);
  if (roomId) {
    localStorage.setItem('hotpot_room', roomId);
    return roomId;
  }
  // 2. Check localStorage for previously joined room
  roomId = localStorage.getItem('hotpot_room');
  if (roomId) return roomId;
  // 3. Use default room
  roomId = DEFAULT_ROOM;
  localStorage.setItem('hotpot_room', roomId);
  window.location.hash = roomId;
  return roomId;
}

const ROOM_ID = getRoomId();

// Connect to room
socket.emit('join-room', ROOM_ID);

// Receive room state on join
socket.on('room-state', (data) => {
  // Merge server data with localStorage backup (server is authoritative)
  const serverOrders = data.orders || {};
  const serverFinalMenu = data.finalMenu || {};
  const localOrders = JSON.parse(localStorage.getItem('hotpot_orders_' + ROOM_ID) || '{}');
  const localFinalMenu = JSON.parse(localStorage.getItem('hotpot_finalMenu_' + ROOM_ID) || '{}');

  // Use server data if available, otherwise fall back to localStorage
  orders = Object.keys(serverOrders).length > 0 ? serverOrders : localOrders;
  finalMenu = Object.keys(serverFinalMenu).length > 0 ? serverFinalMenu : localFinalMenu;

  USERS.forEach(u => {
    if (!orders[u.id]) orders[u.id] = {};
  });
  refreshCurrentScreen();
  document.getElementById('loadingOverlay').style.display = 'none';
});

// Save to localStorage as backup
function saveToLocalStorage() {
  localStorage.setItem('hotpot_orders_' + ROOM_ID, JSON.stringify(orders));
  localStorage.setItem('hotpot_finalMenu_' + ROOM_ID, JSON.stringify(finalMenu));
}

// Receive real-time order updates
socket.on('orders-updated', (data) => {
  if (data.userId) {
    orders[data.userId] = data.orders || {};
  }
  saveToLocalStorage();
  // Refresh cart popup if it's currently open
  const popup = document.getElementById('cartPopup');
  if (popup && popup.style.display === 'flex') showCartPopup();
  refreshCurrentScreen();
});

// Receive real-time final menu updates
socket.on('final-menu-updated', (data) => {
  finalMenu = data.finalMenu || {};
  saveToLocalStorage();
  const activeScreen = document.querySelector('.screen.active');
  if (activeScreen.id === 'screen-summary') renderSummary();
});

// Handle clear all
socket.on('orders-cleared', () => {
  orders = {};
  finalMenu = {};
  USERS.forEach(u => { orders[u.id] = {}; });
  localStorage.removeItem('hotpot_orders_' + ROOM_ID);
  localStorage.removeItem('hotpot_finalMenu_' + ROOM_ID);
  refreshCurrentScreen();
});

// Online count updates
socket.on('user-count', (count) => {
  const el = document.getElementById('onlineInfo');
  const countEl = document.getElementById('onlineCount');
  if (count > 0) {
    el.style.display = 'inline-flex';
    countEl.textContent = count;
  } else {
    el.style.display = 'none';
  }
});

function refreshCurrentScreen() {
  const activeScreen = document.querySelector('.screen.active');
  if (activeScreen.id === 'screen-user') renderUserGrid();
  else if (activeScreen.id === 'screen-menu') {
    renderMenu();
    updateCartBar();
  }
  else if (activeScreen.id === 'screen-summary') renderSummary();
}

// ==================== DATA ====================

// ==================== STATE ====================
let currentUser = null;
let orders = {}; // { userId: { dishId: qty } }
let finalMenu = {}; // { dishId: qty }
let currentSummaryTab = 'person'; // track active summary tab across re-renders

// Initialize orders
USERS.forEach(u => { orders[u.id] = {}; });

// ==================== RENDER: User Selection ====================
function renderUserGrid() {
  const grid = document.getElementById('userGrid');
  grid.innerHTML = USERS.map(u => {
    const orderCount = Object.values(orders[u.id] || {}).reduce((s, q) => s + q, 0);
    const hasOrdered = orderCount > 0;
    return `
      <div class="user-card" onclick="selectUser(${u.id})">
        <div class="avatar" style="background:${u.color}">${u.name[0]}</div>
        <div class="name">${u.name}</div>
        <div class="status ${hasOrdered ? 'ordered' : ''}">${hasOrdered ? '已点 ' + orderCount + ' 样' : '未点菜'}</div>
      </div>
    `;
  }).join('');
}

function selectUser(userId) {
  currentUser = USERS.find(u => u.id === userId);
  socket.emit('select-user', userId);
  document.getElementById('currentUserBadge').textContent = currentUser.name + ' 点菜中';
  document.getElementById('menuSubtitle').textContent = currentUser.name + ' 正在点菜';
  renderMenu();
  updateCartBar();
  showScreen('menu');
}

// ==================== RENDER: Menu ====================
function renderMenu() {
  const nav = document.getElementById('categoryNav');
  nav.innerHTML = CATEGORIES.map((cat, i) =>
    `<div class="cat-item ${i === 0 ? 'active' : ''}" data-cat="${cat}" onclick="scrollToCat('${cat}')">${cat}</div>`
  ).join('');

  const content = document.getElementById('menuContent');
  content.innerHTML = CATEGORIES.map(cat => {
    const dishes = MENU.filter(d => d.cat === cat);
    return `
      <div class="cat-section" id="cat-${cat}">
        <div class="cat-section-title">${cat}</div>
        ${dishes.map(d => renderDishCard(d)).join('')}
      </div>
    `;
  }).join('');

  content.onscroll = () => {
    const sections = content.querySelectorAll('.cat-section');
    let current = CATEGORIES[0];
    sections.forEach(s => {
      if (s.offsetTop - content.offsetTop <= content.scrollTop + 60) {
        current = s.id.replace('cat-', '');
      }
    });
    nav.querySelectorAll('.cat-item').forEach(el => {
      el.classList.toggle('active', el.dataset.cat === current);
    });
  };
}

function renderDishCard(dish) {
  const qty = currentUser ? (orders[currentUser.id]?.[dish.id] || 0) : 0;
  return `
    <div class="dish-card" id="dish-${dish.id}">
      <div class="dish-img">${dish.emoji}</div>
      <div class="dish-info">
        <div class="dish-name">${dish.star ? '<span class="star">★</span>' : ''}${dish.name}${dish.suffix || ''}</div>
        ${dish.recommend ? `<div class="dish-recommend">🔥${dish.recommend}人推荐</div>` : ''}
        ${dish.desc ? `<div class="dish-desc">${dish.desc}</div>` : ''}
        <div class="dish-bottom">
          <div class="dish-price">¥${dish.price}<span>/${dish.unit}</span></div>
          <div class="dish-actions">
            ${qty > 0 ? `<button class="qty-btn minus" onclick="changeQty(${dish.id}, -1)">−</button>` : ''}
            ${qty > 0 ? `<span class="qty-num">${qty}</span>` : ''}
            <button class="qty-btn plus" onclick="changeQty(${dish.id}, 1)">+</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function scrollToCat(cat) {
  const el = document.getElementById('cat-' + cat);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function changeQty(dishId, delta) {
  if (!currentUser) return;
  if (!orders[currentUser.id]) orders[currentUser.id] = {};
  const current = orders[currentUser.id][dishId] || 0;
  const newQty = current + delta;
  if (newQty <= 0) {
    delete orders[currentUser.id][dishId];
  } else {
    orders[currentUser.id][dishId] = newQty;
  }
  // Send to server
  socket.emit('update-order', {
    userId: currentUser.id,
    dishId: dishId,
    quantity: newQty <= 0 ? 0 : newQty
  });
  renderMenu();
  updateCartBar();
}

function updateCartBar() {
  if (!currentUser) return;
  const userOrder = orders[currentUser.id] || {};
  const totalQty = Object.values(userOrder).reduce((s, q) => s + q, 0);
  const totalPrice = Object.entries(userOrder).reduce((s, [id, q]) => {
    const dish = MENU.find(d => d.id === parseInt(id));
    return s + (dish ? dish.price * q : 0);
  }, 0);

  const badge = document.getElementById('cartBadge');
  badge.textContent = totalQty;
  badge.style.display = totalQty > 0 ? 'flex' : 'none';
  document.getElementById('cartTotal').textContent = totalPrice;
  document.getElementById('submitBtn').disabled = totalQty === 0;
}

function submitOrder() {
  if (!currentUser) return;
  const userOrder = orders[currentUser.id] || {};
  const totalQty = Object.values(userOrder).reduce((s, q) => s + q, 0);
  if (totalQty === 0) {
    showToast('请先选择菜品');
    return;
  }
  showToast(`${currentUser.name} 的订单已提交！`);
  showScreen('user');
}

// ==================== CART POPUP ====================
function showCartPopup() {
  if (!currentUser) return;
  const userOrder = orders[currentUser.id] || {};
  const entries = Object.entries(userOrder);
  if (entries.length === 0) {
    showToast('还没点菜呢，快去选吧');
    return;
  }

  document.getElementById('cartPopupTitle').textContent = `${currentUser.name} 的订单`;

  // Group by category
  const byCategory = {};
  let total = 0;
  entries.forEach(([id, qty]) => {
    const dish = MENU.find(d => d.id === parseInt(id));
    if (!dish) return;
    if (!byCategory[dish.cat]) byCategory[dish.cat] = [];
    byCategory[dish.cat].push({ dish, qty });
    total += dish.price * qty;
  });

  let html = '';
  CATEGORIES.forEach(cat => {
    if (!byCategory[cat]) return;
    html += `<div style="margin-bottom:12px">
      <div style="font-size:13px;font-weight:600;color:#FFB300;margin-bottom:6px">${cat}</div>`;
    byCategory[cat].forEach(({ dish, qty }) => {
      html += `<div style="display:flex;align-items:center;padding:6px 0;font-size:14px">
        <span style="flex:1">${dish.emoji} ${dish.name}</span>
        <div style="display:flex;align-items:center;gap:6px;margin:0 8px">
          <button onclick="changeCartQuantity(${dish.id}, ${qty}, -1)" style="width:28px;height:28px;border-radius:50%;border:1.5px solid #ddd;background:#fff;font-size:16px;font-weight:700;color:#666;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1">−</button>
          <span style="font-weight:600;min-width:20px;text-align:center;color:#333">${qty}</span>
          <button onclick="changeCartQuantity(${dish.id}, ${qty}, 1)" style="width:28px;height:28px;border-radius:50%;border:none;background:#FFB300;font-size:16px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1">+</button>
        </div>
        <span style="color:#E65100;font-weight:600;min-width:50px;text-align:right">¥${dish.price * qty}</span>
      </div>`;
    });
    html += `</div>`;
  });

  html += `<div style="border-top:2px solid #FFB300;padding-top:10px;margin-top:8px;display:flex;justify-content:space-between;font-size:16px;font-weight:700">
    <span>合计</span><span style="color:#E65100">¥${total}</span>
  </div>`;

  document.getElementById('cartPopupContent').innerHTML = html;
  const popup = document.getElementById('cartPopup');
  popup.style.display = 'flex';
}

function changeCartQuantity(dishId, currentQty, delta) {
  if (!currentUser) return;
  const newQty = currentQty + delta;

  if (newQty <= 0) {
    // Show confirmation dialog before deleting
    const dish = MENU.find(d => d.id === dishId);
    const dishName = dish ? `${dish.emoji} ${dish.name}` : '该菜品';
    if (confirm(`确定要删除「${dishName}」吗？`)) {
      delete orders[currentUser.id][dishId];
      socket.emit('update-order', {
        userId: currentUser.id,
        dishId: dishId,
        quantity: 0
      });
      showCartPopup(); // Refresh the popup
    }
  } else {
    orders[currentUser.id][dishId] = newQty;
    socket.emit('update-order', {
      userId: currentUser.id,
      dishId: dishId,
      quantity: newQty
    });
    showCartPopup(); // Refresh the popup
  }
  updateCartBar();
  // Also refresh the menu screen if visible
  const activeScreen = document.querySelector('.screen.active');
  if (activeScreen && activeScreen.id === 'screen-menu') renderMenu();
}

function closeCartPopup(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('cartPopup').style.display = 'none';
}

// ==================== RENDER: Summary ====================
function renderSummary() {
  const content = document.getElementById('summaryContent');

  const allDishes = {};
  USERS.forEach(u => {
    const userOrder = orders[u.id] || {};
    Object.entries(userOrder).forEach(([id, qty]) => {
      if (!allDishes[id]) allDishes[id] = 0;
      allDishes[id] += qty;
    });
  });

  const hasAnyOrder = Object.keys(allDishes).length > 0;

  if (!hasAnyOrder) {
    content.innerHTML = `
      <div class="empty-state">
        <div class="icon">🍽️</div>
        <p>还没有人点菜，快去点菜吧！</p>
      </div>
    `;
    return;
  }

  let personHTML = '';
  USERS.forEach(u => {
    const userOrder = orders[u.id] || {};
    const entries = Object.entries(userOrder);
    if (entries.length === 0) return;
    const total = entries.reduce((s, [id, q]) => {
      const dish = MENU.find(d => d.id === parseInt(id));
      return s + (dish ? dish.price * q : 0);
    }, 0);
    personHTML += `
      <div class="summary-section">
        <div class="person-header">
          <div class="avatar-sm" style="background:${u.color}">${u.name[0]}</div>
          ${u.name}
          <span style="margin-left:auto;font-size:14px;color:#E65100;font-weight:600">¥${total}</span>
        </div>
        ${entries.map(([id, qty]) => {
          const dish = MENU.find(d => d.id === parseInt(id));
          if (!dish) return '';
          return `<div class="person-dish">
            <span class="pd-name">${dish.emoji} ${dish.name}</span>
            <span class="pd-qty">×${qty}</span>
            <span style="color:#999;font-size:13px">¥${dish.price * qty}</span>
          </div>`;
        }).join('')}
      </div>
    `;
  });

  // Group dishes by category for summary
  const dishesByCategory = {};
  const sortedDishes = Object.entries(allDishes).sort((a, b) => b[1] - a[1]);
  let grandTotal = 0;
  let dishTotalAll = 0;

  sortedDishes.forEach(([id, totalQty]) => {
    const dish = MENU.find(d => d.id === parseInt(id));
    if (!dish) return;
    if (!dishesByCategory[dish.cat]) dishesByCategory[dish.cat] = [];
    dishesByCategory[dish.cat].push({ id, totalQty });
    const finalQty = finalMenu[id] !== undefined ? finalMenu[id] : totalQty;
    grandTotal += dish.price * finalQty;
    dishTotalAll += dish.price * totalQty;
  });

  // Helper: render category group header
  function catHeader(cat, count, total) {
    return `<div style="font-size:13px;font-weight:600;color:#FFB300;padding:10px 0 6px;border-bottom:1px solid #f0f0f0;margin-bottom:4px;display:flex;justify-content:space-between">
      <span>${cat}（${count}种）</span><span style="color:#999;font-size:12px">¥${total}</span>
    </div>`;
  }

  // Build "按菜汇总" HTML grouped by category
  let dishSummaryHTML = '';
  CATEGORIES.forEach(cat => {
    const items = dishesByCategory[cat];
    if (!items || items.length === 0) return;
    const catTotal = items.reduce((s, { id, totalQty }) => {
      const d = MENU.find(x => x.id === parseInt(id));
      return s + (d ? d.price * totalQty : 0);
    }, 0);
    dishSummaryHTML += catHeader(cat, items.length, catTotal);
    items.forEach(({ id, totalQty }) => {
      const dish = MENU.find(d => d.id === parseInt(id));
      if (!dish) return;
      dishSummaryHTML += `<div class="summary-row">
        <span class="dish-name-sm">${dish.emoji} ${dish.name}</span>
        <span class="dish-qty">${totalQty}份</span>
        <span class="dish-price-sm">¥${dish.price * totalQty}</span>
      </div>`;
    });
  });

  // Build "最终菜单" HTML grouped by category
  let finalMenuHTML = '';
  CATEGORIES.forEach(cat => {
    const items = dishesByCategory[cat];
    if (!items || items.length === 0) return;
    const catTotal = items.reduce((s, { id, totalQty }) => {
      const d = MENU.find(x => x.id === parseInt(id));
      const fq = finalMenu[id] !== undefined ? finalMenu[id] : totalQty;
      return s + (d ? d.price * fq : 0);
    }, 0);
    finalMenuHTML += catHeader(cat, items.length, catTotal);
    items.forEach(({ id, totalQty }) => {
      const dish = MENU.find(d => d.id === parseInt(id));
      if (!dish) return;
      const finalQty = finalMenu[id] !== undefined ? finalMenu[id] : totalQty;
      const lineTotal = dish.price * finalQty;

      const orderers = [];
      USERS.forEach(u => {
        const q = orders[u.id]?.[parseInt(id)] || 0;
        if (q > 0) orderers.push(`${u.name}×${q}`);
      });

      finalMenuHTML += `<div class="summary-row">
        <span class="dish-name-sm">${dish.emoji} ${dish.name}</span>
        <span style="font-size:12px;color:#999;margin-right:8px">${orderers.join('，')}</span>
        <div class="adjust-btns">
          <button class="adj-btn" onclick="adjustFinal(${id}, -1)">−</button>
          <span class="adj-num">${finalQty}</span>
          <button class="adj-btn" onclick="adjustFinal(${id}, 1)">+</button>
        </div>
        <span class="dish-price-sm">¥${lineTotal}</span>
      </div>`;
    });
  });

  content.innerHTML = `
    <div class="summary-tabs">
      <div class="summary-tab${currentSummaryTab === 'person' ? ' active' : ''}" onclick="switchSummaryTab(this, 'person')">按人查看</div>
      <div class="summary-tab${currentSummaryTab === 'dish' ? ' active' : ''}" onclick="switchSummaryTab(this, 'dish')">按菜汇总</div>
      <div class="summary-tab${currentSummaryTab === 'final' ? ' active' : ''}" onclick="switchSummaryTab(this, 'final')">最终菜单</div>
    </div>
    <div id="tab-person" style="display:${currentSummaryTab === 'person' ? 'block' : 'none'}">${personHTML}</div>
    <div id="tab-dish" style="display:${currentSummaryTab === 'dish' ? 'block' : 'none'}">
      <div class="summary-section">
        <h3>📊 菜品汇总（按品类分组）</h3>
        <p style="font-size:12px;color:#999;margin-bottom:8px">查看各品类分布，合理搭配荤素</p>
        ${dishSummaryHTML}
        <div class="total-bar">
          <span>合计</span>
          <span class="total-price">¥${dishTotalAll}</span>
        </div>
      </div>
    </div>
    <div id="tab-final" style="display:${currentSummaryTab === 'final' ? 'block' : 'none'}">
      <div class="summary-section">
        <h3>📋 最终菜单（按品类分组，可调整份数）</h3>
        <p style="font-size:12px;color:#999;margin-bottom:8px">根据汇总情况调整每道菜的最终份数</p>
        ${finalMenuHTML}
        <div class="total-bar">
          <span>最终合计</span>
          <span class="total-price">¥${grandTotal}</span>
        </div>
      </div>
      <div style="text-align:center;margin-top:20px">
        <button class="cart-btn" onclick="exportFinalMenu()" style="padding:14px 40px;font-size:17px">📋 导出最终菜单</button>
      </div>
    </div>
  `;
}

function switchSummaryTab(el, tab) {
  currentSummaryTab = tab;
  el.parentElement.querySelectorAll('.summary-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  ['person', 'dish', 'final'].forEach(t => {
    const panel = document.getElementById('tab-' + t);
    if (panel) panel.style.display = t === tab ? 'block' : 'none';
  });
}

function adjustFinal(dishId, delta) {
  const current = finalMenu[dishId] !== undefined ? finalMenu[dishId] :
    (Object.values(orders).reduce((s, o) => s + (o[dishId] || 0), 0));
  const newQty = Math.max(0, current + delta);
  if (newQty === 0) {
    delete finalMenu[dishId];
  } else {
    finalMenu[dishId] = newQty;
  }
  // Send to server
  socket.emit('update-final-menu', {
    dishId: dishId,
    quantity: newQty
  });
  // Re-render (currentSummaryTab ensures correct tab stays active)
  renderSummary();
}

function exportFinalMenu() {
  const allDishes = {};
  USERS.forEach(u => {
    Object.entries(orders[u.id] || {}).forEach(([id, qty]) => {
      if (!allDishes[id]) allDishes[id] = 0;
      allDishes[id] += qty;
    });
  });

  let text = '🍲 马厂老火锅（真如店）最终菜单\n';
  text += '━━━━━━━━━━━━━━━━━━\n\n';

  let grandTotal = 0;
  const sortedDishes = Object.entries(allDishes).sort((a, b) => b[1] - a[1]);

  sortedDishes.forEach(([id, totalQty]) => {
    const dish = MENU.find(d => d.id === parseInt(id));
    if (!dish) return;
    const finalQty = finalMenu[id] !== undefined ? finalMenu[id] : totalQty;
    if (finalQty <= 0) return;
    const lineTotal = dish.price * finalQty;
    grandTotal += lineTotal;

    const orderers = [];
    USERS.forEach(u => {
      const q = orders[u.id]?.[parseInt(id)] || 0;
      if (q > 0) orderers.push(`${u.name}×${q}`);
    });

    text += `${dish.name} × ${finalQty}份 = ¥${lineTotal}\n`;
    text += `  （${orderers.join('，')}）\n\n`;
  });

  text += '━━━━━━━━━━━━━━━━━━\n';
  text += `总计：¥${grandTotal}\n`;

  navigator.clipboard.writeText(text).then(() => {
    showToast('最终菜单已复制到剪贴板！');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('最终菜单已复制到剪贴板！');
  });
}

// ==================== NAVIGATION ====================
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');

  if (name === 'user') {
    renderUserGrid();
  } else if (name === 'summary') {
    currentSummaryTab = 'person';
    renderSummary();
  }

  window.scrollTo(0, 0);
}

function goBackFromSummary() {
  if (currentUser) showScreen('menu');
  else showScreen('user');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 1800);
}

function startNewSession() {
  if (!confirm('确定要清空所有点菜数据，开始新一轮点菜吗？')) return;
  // Clear server data
  socket.emit('update-order', { userId: -1, dishId: '__clear__', quantity: 0 });
  // Clear localStorage
  localStorage.removeItem('hotpot_orders_' + ROOM_ID);
  localStorage.removeItem('hotpot_finalMenu_' + ROOM_ID);
  // Clear local state
  orders = {};
  finalMenu = {};
  USERS.forEach(u => { orders[u.id] = {}; });
  refreshCurrentScreen();
  showToast('已清空，可以开始新一轮点菜');
}

// ==================== INIT ====================
document.getElementById('roomInfo').innerHTML = `房间: ${ROOM_ID.slice(0, 8)}`;

// Hide loading after 5 seconds fallback
setTimeout(() => {
  document.getElementById('loadingOverlay').style.display = 'none';
}, 5000);

renderUserGrid();
</script>
</body>
</html>
